[project]
name = "credit-risk-collections"
version = "0.1.0"
description = "Credit risk scorecard and collections prioritization analytics on Home Credit data"
readme = "README.md"
authors = [
    { name = "Vu Trung Kien", email = "kienvu.contact@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "optbinning>=1.0.0",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "scikit-learn==1.8.0",
    "shap>=0.53.0",
    "streamlit>=1.65.0",
]

[project.scripts]
crc = "credit_risk_collections.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
