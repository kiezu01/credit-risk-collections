version: 2

models:
  - name: int_instalments
    description: One row per scheduled instalment with paid-by-due and paid-in-window amounts.
    columns:
      - name: instalment_id
        data_tests: [unique, not_null]
  - name: int_bureau_by_customer
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: int_previous_applications_by_customer
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: int_payment_behaviour_by_customer
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
